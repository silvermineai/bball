[project]
name = "ncaa-scraper"
version = "0.1.0"
description = "NCAA Basketball data scraper and analytics package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "polars>=1.29.0",
    "numpy>=1.26.0",
    "plotly>=6.1.0",
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "lxml>=5.0.0",
    "pydantic>=2.8.0",
    "scrapling[fetchers]>=0.4.8",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ncaa_scraper"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ipdb>=0.13.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
ncaa-scraper = "ncaa_scraper.cli:main"
