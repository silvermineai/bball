name: Refresh research publication

on:
  schedule:
    # Daily source refresh; manual dispatch remains available for a faster
    # correction after a publisher releases an amended file.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: Which source/model publisher should run?
        required: true
        type: choice
        default: both
        options:
          - both
          - football
          - basketball
      capture_odds:
        description: Capture one licensed odds snapshot after the refresh
        required: true
        type: boolean
        default: false
      capture_cbbd_lines:
        description: Capture authorized CBBD basketball moneylines after the refresh
        required: true
        type: boolean
        default: false
      capture_cbbd_recruiting:
        description: Capture authorized CBBD recruiting and portal records after the refresh
        required: true
        type: boolean
        default: false
      refresh_ncaa:
        description: Refresh NCAA national player snapshots when robots policy permits (basketball or both)
        required: true
        type: boolean
        default: false

concurrency:
  group: research-publication
  # A newer source/model publication supersedes an older one. Cancelling here
  # prevents a stale checkout from reaching the deploy step after a correction.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN_ACCOUNT: ${{ secrets.CF_API_TOKEN_ACCOUNT }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./ncaa_scraper

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix worker

      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Missing repository secret CF_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CF_API_TOKEN_ACCOUNT" || { echo "Missing repository secret CF_API_TOKEN_ACCOUNT" >&2; exit 1; }

      - name: Refresh robots-permitted NCAA national player snapshots
        # Scheduled runs keep the source snapshot current when the publisher
        # permits crawling. Manual football-only runs stay opt-in so they do
        # not spend time on an unrelated NCAA release.
        if: ${{ (github.event_name == 'schedule' || inputs.refresh_ncaa == true) && (inputs.sport == 'both' || inputs.sport == 'basketball' || inputs.sport == '') }}
        run: |
          python -m ncaa_scraper.ncaa_individual --divisions 1 2 3

      - name: Refresh permitted ESPN basketball RSS context
        # The ESPN and NCAA.com feeds provide publisher context. The refresh
        # stores supplied headline, summary and URL fields and never fetches
        # linked article pages.
        if: ${{ github.event_name == 'schedule' || inputs.sport == 'both' || inputs.sport == 'basketball' || inputs.sport == '' }}
        run: python scripts/refresh-news-rss.py

      - name: Refresh selected sources, models and publication
        env:
          REFRESH_SPORT: ${{ inputs.sport || 'both' }}
        run: |
          case "$REFRESH_SPORT" in
            football)
              BATCH_PUBLICATION=1 python scripts/publish-football.py
              ;;
            basketball)
              BATCH_PUBLICATION=1 python scripts/publish-basketball.py
              ;;
            both)
              BATCH_PUBLICATION=1 python scripts/publish-football.py
              BATCH_PUBLICATION=1 python scripts/publish-basketball.py
              ;;
            *)
              echo "Unsupported sport: $REFRESH_SPORT" >&2
              exit 1
              ;;
          esac

      - name: Check release freshness and shape
        env:
          REFRESH_SPORT: ${{ inputs.sport || 'both' }}
        run: |
          python -m unittest discover -s ncaa_scraper/tests -p 'test_publication_health.py'
          python scripts/check-freshness.py --sport "$REFRESH_SPORT"

      - name: Validate and deploy combined publication
        # When a scheduled run has a licensed odds key, the odds-aware
        # publication below performs the final validation/deploy after the
        # quote capture. Without a key, keep the normal one-pass deploy.
        if: ${{ inputs.capture_odds != true && inputs.capture_cbbd_lines != true && inputs.capture_cbbd_recruiting != true && (github.event_name != 'schedule' || (env.THE_ODDS_API_KEY == '' && env.CBBD_API_KEY == '')) }}
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
          npm run typecheck --prefix worker
          npm test --prefix worker
          python scripts/cloudflare.py deploy

      - name: Capture licensed market snapshots
        # Manual dispatch remains explicit; scheduled runs opt in only when
        # the repository has supplied the licensed provider secret.
        if: ${{ inputs.capture_odds == true || inputs.capture_cbbd_lines == true || (github.event_name == 'schedule' && (env.THE_ODDS_API_KEY != '' || env.CBBD_API_KEY != '')) }}
        run: |
          ARGS=""
          if [ "${{ inputs.capture_odds }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ] && [ -n "$THE_ODDS_API_KEY" ]; then
            test -n "$THE_ODDS_API_KEY" || { echo "capture_odds requires repository secret THE_ODDS_API_KEY" >&2; exit 1; }
            ARGS="$ARGS --odds"
          fi
          if [ "${{ inputs.capture_cbbd_lines }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ] && [ -n "$CBBD_API_KEY" ]; then
            test -n "$CBBD_API_KEY" || { echo "capture_cbbd_lines requires repository secret CBBD_API_KEY" >&2; exit 1; }
            ARGS="$ARGS --cbbd-lines"
          fi
          python scripts/publish-research.py $ARGS

      - name: Capture authorized CBBD recruiting evidence
        if: ${{ inputs.capture_cbbd_recruiting == true || (github.event_name == 'schedule' && env.CBBD_API_KEY != '') }}
        run: |
          test -n "$CBBD_API_KEY" || { echo "capture_cbbd_recruiting requires repository secret CBBD_API_KEY" >&2; exit 1; }
          python -m ncaa_scraper.cbbd_recruiting --season 2027
          python scripts/sync-cbbd-recruiting.py
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.capture_odds }}" != "true" ] && [ "${{ inputs.capture_cbbd_lines }}" != "true" ]; then
            python scripts/cloudflare.py deploy
          fi

      - name: Record publication summary
        run: |
          {
            echo "### Research publication completed"
            echo "- Source/model selection: \`${{ inputs.sport || 'both' }}\`"
            echo "- Odds capture requested: \`${{ inputs.capture_odds || false }}\`"
            echo "- CBBD lines capture requested: \`${{ inputs.capture_cbbd_lines || false }}\`"
            echo "- CBBD recruiting capture requested: \`${{ inputs.capture_cbbd_recruiting || false }}\`"
            echo "- NCAA snapshot refresh requested: \`${{ github.event_name == 'schedule' || inputs.refresh_ncaa == true }}\`"
            echo "- Archive capture runs automatically after each successful Worker deployment."
          } >> "$GITHUB_STEP_SUMMARY"
