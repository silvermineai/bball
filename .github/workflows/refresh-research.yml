name: Refresh research publication

on:
  schedule:
    # Daily source refresh; manual dispatch remains available for a faster
    # correction after a publisher releases an amended file.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: Which source/model publisher should run?
        required: true
        type: choice
        default: both
        options:
          - both
          - football
          - basketball
      capture_odds:
        description: Capture one licensed odds snapshot after the refresh
        required: true
        type: boolean
        default: false
      capture_cbbd_lines:
        description: Capture authorized CBBD basketball moneylines after the refresh
        required: true
        type: boolean
        default: false
      capture_espn_lines:
        description: Capture prospective public ESPN basketball pickcenter quotes after the refresh
        required: true
        type: boolean
        default: false
      capture_cbbd_recruiting:
        description: Capture authorized CBBD recruiting and portal records after the refresh
        required: true
        type: boolean
        default: false
      refresh_ncaa:
        description: Refresh NCAA national player snapshots when robots policy permits (basketball or both)
        required: true
        type: boolean
        default: false
      full_d1_rebuild:
        description: Refresh every historical basketball source and replay every D1 partition (deliberate bootstrap or repair)
        required: true
        type: boolean
        default: false

concurrency:
  group: research-publication
  # A newer source/model publication supersedes an older one. Cancelling here
  # prevents a stale checkout from reaching the deploy step after a correction.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN_ACCOUNT: ${{ secrets.CF_API_TOKEN_ACCOUNT }}
      FOOTBALL_D1_DATABASE: bball-football-v1
      # The historical basketball archive is already retained in D1. Daily
      # maintenance refreshes only the newest source partitions. A manual
      # full_d1_rebuild dispatch explicitly unsets the maintenance mode.
      BASKETBALL_D1_INCREMENTAL: ${{ (github.event_name != 'workflow_dispatch' || inputs.full_d1_rebuild != true) && '1' || '' }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./ncaa_scraper

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix worker

      - name: Restore attributed source release cache
        uses: actions/cache@v4
        with:
          path: |
            .local/basketball
            .local/football
            ncaa_scraper/ncaa_scraper/cache
          key: research-source-cache-${{ runner.os }}-${{ hashFiles('ncaa_scraper/ncaa_scraper/*sources.py', 'ncaa_scraper/ncaa_scraper/fetcher.py') }}
          restore-keys: |
            research-source-cache-${{ runner.os }}-

      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Missing repository secret CF_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CF_API_TOKEN_ACCOUNT" || { echo "Missing repository secret CF_API_TOKEN_ACCOUNT" >&2; exit 1; }

      - name: Refresh robots-permitted NCAA national player snapshots
        # Scheduled runs keep the source snapshot current when the publisher
        # permits crawling. Manual football-only runs stay opt-in so they do
        # not spend time on an unrelated NCAA release. If the publisher's
        # robots endpoint cannot be verified, fail closed and keep the cached
        # release; an upstream policy outage must not block the other sources.
        if: ${{ (github.event_name == 'schedule' || inputs.refresh_ncaa == true) && (inputs.sport == 'both' || inputs.sport == 'basketball' || inputs.sport == '') }}
        run: |
          set +e
          python -m ncaa_scraper.ncaa_individual --divisions 1 2 3 > /tmp/ncaa-refresh.log 2>&1
          status=$?
          cat /tmp/ncaa-refresh.log
          if [ "$status" -ne 0 ]; then
            if grep -Eqi "robots(\.txt| policy)|cannot verify NCAA robots|no page requested|disallows this request" /tmp/ncaa-refresh.log; then
              echo "::warning::NCAA robots policy could not be verified; retaining the cached NCAA release and continuing the publication."
              exit 0
            fi
            exit "$status"
          fi

      - name: Refresh permitted ESPN basketball RSS context
        # The ESPN and NCAA.com feeds provide publisher context. The refresh
        # stores supplied headline, summary and URL fields and never fetches
        # linked article pages.
        if: ${{ github.event_name == 'schedule' || inputs.sport == 'both' || inputs.sport == 'basketball' || inputs.sport == '' }}
        run: python scripts/refresh-news-rss.py

      - name: Refresh selected sources, models and publication
        env:
          REFRESH_SPORT: ${{ inputs.sport || 'both' }}
        run: |
          case "$REFRESH_SPORT" in
            football)
              BATCH_PUBLICATION=1 python scripts/publish-football.py
              ;;
            basketball)
              BATCH_PUBLICATION=1 python scripts/publish-basketball.py
              ;;
            both)
              BATCH_PUBLICATION=1 python scripts/publish-football.py
              BATCH_PUBLICATION=1 python scripts/publish-basketball.py
              ;;
            *)
              echo "Unsupported sport: $REFRESH_SPORT" >&2
              exit 1
              ;;
          esac

      - name: Check release freshness and shape
        env:
          REFRESH_SPORT: ${{ inputs.sport || 'both' }}
        run: |
          python -m unittest discover -s ncaa_scraper/tests -p 'test_publication_health.py'
          python scripts/check-freshness.py --sport "$REFRESH_SPORT"

      - name: Validate and deploy combined publication
        # When a scheduled run has a licensed odds key, the odds-aware
        # publication below performs the final validation/deploy after the
        # quote capture. Without a key, keep the normal one-pass deploy.
        if: ${{ inputs.capture_odds != true && inputs.capture_cbbd_lines != true && inputs.capture_espn_lines != true && inputs.capture_cbbd_recruiting != true && github.event_name != 'schedule' }}
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
          npm run typecheck --prefix worker
          npm test --prefix worker
          python scripts/cloudflare.py deploy

      - name: Capture licensed market snapshots
        # Manual dispatch remains explicit; scheduled runs opt in only when
        # the repository has supplied the licensed provider secret.
        if: ${{ inputs.capture_odds == true || inputs.capture_cbbd_lines == true || inputs.capture_espn_lines == true || github.event_name == 'schedule' }}
        run: |
          ARGS=""
          if [ "${{ inputs.capture_odds }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ] && [ -n "$THE_ODDS_API_KEY" ]; then
            test -n "$THE_ODDS_API_KEY" || { echo "capture_odds requires repository secret THE_ODDS_API_KEY" >&2; exit 1; }
            ARGS="$ARGS --odds"
          fi
          if [ "${{ inputs.capture_cbbd_lines }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ] && [ -n "$CBBD_API_KEY" ]; then
            test -n "$CBBD_API_KEY" || { echo "capture_cbbd_lines requires repository secret CBBD_API_KEY" >&2; exit 1; }
            ARGS="$ARGS --cbbd-lines"
          fi
          if [ "${{ inputs.capture_espn_lines }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --espn-lines"
          fi
          python scripts/publish-research.py $ARGS

      - name: Capture authorized CBBD recruiting evidence
        if: ${{ inputs.capture_cbbd_recruiting == true || (github.event_name == 'schedule' && env.CBBD_API_KEY != '') }}
        run: |
          test -n "$CBBD_API_KEY" || { echo "capture_cbbd_recruiting requires repository secret CBBD_API_KEY" >&2; exit 1; }
          python -m ncaa_scraper.cbbd_recruiting --season 2027
          python scripts/sync-cbbd-recruiting.py
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.capture_odds }}" != "true" ] && [ "${{ inputs.capture_cbbd_lines }}" != "true" ] && [ "${{ inputs.capture_espn_lines }}" != "true" ]; then
            python scripts/cloudflare.py deploy
          fi

      - name: Smoke test production publication
        # Deployment success only proves that assets uploaded. Exercise the
        # public D1-backed route as well so a schema/query regression cannot
        # leave the coverage desk returning an HTTP 500 after a green deploy.
        env:
          REFRESH_SPORT: ${{ inputs.sport || 'both' }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 https://bball.silvermine.dev/ >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            'https://bball.silvermine.dev/api/basketball/research/coverage?workflow_smoke=1' \
            -o /tmp/basketball-coverage.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            'https://bball.silvermine.dev/api/basketball/research/news?limit=1&workflow_smoke=1' \
            -o /tmp/basketball-news.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            'https://bball.silvermine.dev/api/basketball/research/forecasts?season=2027&status=upcoming&limit=1&workflow_smoke=1' \
            -o /tmp/basketball-forecasts.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            'https://bball.silvermine.dev/api/basketball/research/ncaa-leaders?meta=1&workflow_smoke=1' \
            -o /tmp/ncaa-leaders-meta.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            'https://bball.silvermine.dev/api/basketball/research/recruiting?season=2027&publication_check=1' \
            -o /tmp/basketball-recruiting.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/basketball-coverage.json').read_text())
          required = {'coverage', 'source_receipts', 'location_validation', 'possession_validation'}
          missing = sorted(required.difference(payload))
          if missing:
              raise SystemExit(f'coverage response is missing required fields: {missing}')
          if not isinstance(payload['coverage'], list) or not payload['coverage']:
              raise SystemExit('coverage response has no dataset rows')
          for key in ('location_validation', 'possession_validation'):
              if not isinstance(payload[key], dict):
                  raise SystemExit(f'coverage response has no {key} object')
          print('Production coverage smoke test passed')

          recruiting = json.loads(Path('/tmp/basketball-recruiting.json').read_text())
          recruiting_coverage = recruiting.get('coverage')
          sources = recruiting.get('sources')
          if recruiting.get('season') != 2027 or not isinstance(recruiting_coverage, dict):
              raise SystemExit('recruiting response has an unexpected season or coverage')
          if any(not isinstance(recruiting_coverage.get(key), int) or recruiting_coverage[key] <= 0 for key in ('programs', 'players', 'events', 'sources')):
              raise SystemExit('recruiting response has incomplete coverage counts')
          if not isinstance(sources, list) or len(sources) != recruiting_coverage['sources']:
              raise SystemExit('recruiting response has incomplete source receipts')
          if any(not isinstance(source, dict) or not isinstance(source.get('source_sha256'), str) or len(source['source_sha256']) != 64 for source in sources):
              raise SystemExit('recruiting response has malformed source receipts')
          print('Production recruiting evidence smoke test passed')

          news = json.loads(Path('/tmp/basketball-news.json').read_text())
          if news.get('sport') != 'mens-college-basketball':
              raise SystemExit('news response has an unexpected sport')
          if not isinstance(news.get('total'), int) or news['total'] < 0:
              raise SystemExit('news response has no numeric total')
          if not isinstance(news.get('rows'), list) or len(news['rows']) > 1:
              raise SystemExit('news response has an invalid bounded row page')
          for row in news['rows']:
              for field in ('id', 'publisher', 'headline', 'published', 'link'):
                  if not row.get(field):
                      raise SystemExit(f'news row is missing {field}')
          print('Production news smoke test passed')

          forecasts = json.loads(Path('/tmp/basketball-forecasts.json').read_text())
          if forecasts.get('season') != 2027 or forecasts.get('status') != 'upcoming':
              raise SystemExit('forecast response has an unexpected season or status')
          if not isinstance(forecasts.get('total'), int) or forecasts['total'] <= 0:
              raise SystemExit('forecast response has no upcoming rows')
          if not isinstance(forecasts.get('rows'), list) or len(forecasts['rows']) > 1:
              raise SystemExit('forecast response has an invalid bounded row page')
          for row in forecasts['rows']:
              for field in ('game_id', 'model_id', 'starts_at', 'home_id', 'away_id', 'prediction'):
                  if row.get(field) in (None, ''):
                      raise SystemExit(f'forecast row is missing {field}')
          print('Production forecast smoke test passed')

          ncaa = json.loads(Path('/tmp/ncaa-leaders-meta.json').read_text())
          coverage = ncaa.get('coverage')
          if ncaa.get('season') != 2026 or not isinstance(coverage, dict):
              raise SystemExit('NCAA leaderboard metadata has an unexpected shape')
          if not isinstance(coverage.get('players'), int) or coverage['players'] <= 0:
              raise SystemExit('NCAA leaderboard metadata has no player coverage')
          divisions = coverage.get('divisions')
          if not isinstance(divisions, dict) or any(str(key) not in divisions for key in (1, 2, 3)):
              raise SystemExit('NCAA leaderboard metadata is missing a division')
          print('Production NCAA leaderboard metadata smoke test passed')
          PY

          case "$REFRESH_SPORT" in
            football|both)
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                'https://bball.silvermine.dev/api/football/coverage?workflow_smoke=1' \
                -o /tmp/football-coverage.json
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                'https://bball.silvermine.dev/api/football/source-stats?meta=1&workflow_smoke=1' \
                -o /tmp/football-source-meta.json
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                'https://bball.silvermine.dev/api/football/recruiting?meta=1&workflow_smoke=1' \
                -o /tmp/football-recruiting-meta.json
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                'https://bball.silvermine.dev/api/football/events?dataset=defense&season=2025&sort=sacks&positive=1&workflow_smoke=1' \
                -o /tmp/football-events.json
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                'https://bball.silvermine.dev/api/football/research/forecasts?season=2026&status=upcoming&limit=1&workflow_smoke=1' \
                -o /tmp/football-forecasts.json
              python - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('/tmp/football-coverage.json').read_text())
          entries = {row.get('dataset'): row.get('rows') for row in coverage.get('coverage', [])}
          if entries.get('games', 0) <= 0 or entries.get('box', 0) <= 0:
              raise SystemExit('football coverage has no game or box rows')
          if not isinstance(coverage.get('source_receipts'), list) or not coverage['source_receipts']:
              raise SystemExit('football coverage has no source receipts')

          source_meta = json.loads(Path('/tmp/football-source-meta.json').read_text())
          if 2026 not in source_meta.get('seasons', []):
              raise SystemExit('football source metadata is missing the current season')
          if not isinstance(source_meta.get('datasets'), list) or not source_meta['datasets']:
              raise SystemExit('football source metadata has no datasets')

          personnel = json.loads(Path('/tmp/football-recruiting-meta.json').read_text())
          if 2026 not in personnel.get('seasons', []):
              raise SystemExit('football recruiting metadata is missing the current season')
          current = {
              row.get('dataset'): row.get('rows')
              for row in personnel.get('datasets', [])
              if row.get('season') == 2026
          }
          required = {'rosters', 'recruits', 'team_talent', 'returning_production'}
          if set(current) != required or any(not isinstance(current[name], int) or current[name] <= 0 for name in required):
              raise SystemExit('football recruiting metadata has incomplete current-season coverage')
          receipts = [row for row in personnel.get('receipts', []) if row.get('season') == 2026]
          if len(receipts) != len(required):
              raise SystemExit('football recruiting metadata has incomplete source receipts')

          events = json.loads(Path('/tmp/football-events.json').read_text())
          if events.get('dataset') != 'defense' or events.get('season') != 2025:
              raise SystemExit('football events smoke has an unexpected edition')
          if not events.get('edition') or not isinstance(events.get('rows'), list):
              raise SystemExit('football events smoke has an invalid bounded page')
          if events.get('total', 0) <= 0:
              raise SystemExit('football events smoke has no positive sacks')

          forecasts = json.loads(Path('/tmp/football-forecasts.json').read_text())
          if forecasts.get('season') != 2026 or forecasts.get('status') != 'upcoming':
              raise SystemExit('football forecast response has an unexpected season or status')
          if forecasts.get('total', 0) <= 0 or not isinstance(forecasts.get('rows'), list):
              raise SystemExit('football forecast response has no upcoming rows')
          for row in forecasts['rows']:
              for field in ('game_id', 'model_id', 'kickoff', 'home_id', 'away_id', 'home_margin', 'total', 'home_win_probability'):
                  if row.get(field) in (None, ''):
                      raise SystemExit(f'football forecast row is missing {field}')
          print('Production football coverage, source, personnel, event and forecast smoke tests passed')
          PY
              ;;
          esac

      - name: Record publication summary
        run: |
          {
            echo "### Research publication completed"
            echo "- Source/model selection: \`${{ inputs.sport || 'both' }}\`"
            echo "- Odds capture requested: \`${{ inputs.capture_odds || false }}\`"
            echo "- CBBD lines capture requested: \`${{ inputs.capture_cbbd_lines || false }}\`"
            echo "- ESPN lines capture requested: \`${{ inputs.capture_espn_lines || false }}\`"
            echo "- CBBD recruiting capture requested: \`${{ inputs.capture_cbbd_recruiting || false }}\`"
            echo "- NCAA snapshot refresh requested: \`${{ github.event_name == 'schedule' || inputs.refresh_ncaa == true }}\`"
            echo "- Archive capture runs automatically after each successful Worker deployment."
          } >> "$GITHUB_STEP_SUMMARY"
