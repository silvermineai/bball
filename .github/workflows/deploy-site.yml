name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-site.yml"
      - "frontend/**"
      - "worker/**"
      - "scripts/cloudflare.py"
      - "scripts/combine-builds.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN_ACCOUNT: ${{ secrets.CF_API_TOKEN_ACCOUNT }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deployment helper
        run: python -m pip install --disable-pip-version-check python-dotenv

      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Missing repository secret CF_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CF_API_TOKEN_ACCOUNT" || { echo "Missing repository secret CF_API_TOKEN_ACCOUNT" >&2; exit 1; }

      - name: Test and build frontend
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Check Worker
        run: |
          npm run typecheck --prefix worker
          npm test --prefix worker

      - name: Deploy combined site and Worker
        env:
          SKIP_BRIEF_ARCHIVE: "1"
        run: python scripts/cloudflare.py deploy

      - name: Smoke test production
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 https://bball.silvermine.dev/ >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 https://bball.silvermine.dev/api/health >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            'https://bball.silvermine.dev/api/basketball/research/forecasts?season=2027&status=upcoming&limit=1&workflow_smoke=1' \
            | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("season") == 2027 and p.get("total", 0) > 0 and p.get("rows"), "forecast smoke response is empty"'
